<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>상황판</title>
<!-- 모양 한 벌 — PC 앱도 이 파일을 읽는다(설계 제12조 ①) -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<!-- 폰에서 「홈 화면에 추가」하면 앱처럼 열린다(설계 제7조 ③) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<!-- 상황판 — 의회·설계실·작업 화면(관리부 설계 `bp-상황판` 제2조 ⑧⑨⑩ · 제6조 · 제7조 ③ · 제10조 · 제11조). -->
<!-- PC 앱과 모바일 앱이 이 한 벌을 쓴다. 문서는 GitHub에서 열쇠로 읽고, 찍은 답은 GitHub에 커밋으로 적는다. -->
<header class="머리">
  <strong class="앱이름">상황판</strong>
  <nav class="윗탭" aria-label="화면">
    <a href="#홈" data-탭="홈">홈</a><a href="#의회" data-탭="의회">의회</a><a href="#설계실" data-탭="설계실">설계실</a><a href="#작업" data-탭="작업">작업</a>
  </nav>
  <span class="시각" id="시각"></span>
  <button type="button" class="작은단추" id="다시읽기" title="GitHub에서 다시 읽는다">↻</button>
</header>
<main id="본문"><p class="안내">읽는 중…</p></main>
<div class="박스덮개" id="박스덮개" hidden><section class="박스" id="박스" aria-live="polite"></section></div>
<nav class="아래탭" aria-label="화면">
  <a href="#홈" data-탭="홈">홈</a><a href="#의회" data-탭="의회">의회</a><a href="#설계실" data-탭="설계실">설계실</a><a href="#작업" data-탭="작업">작업</a>
</nav>
<script type="module" src="app.mjs"></script>
</body>
</html>
